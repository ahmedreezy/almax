name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production frontend
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy frontend to cPanel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}
      API_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST production secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER production secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY production secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS production secret}"
          : "${FRONTEND_DEPLOY_PATH:?Missing FRONTEND_DEPLOY_PATH production variable}"
          : "${API_DEPLOY_PATH:?Missing API_DEPLOY_PATH production variable}"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend
        shell: bash
        run: |
          port="${DEPLOY_PORT:-22}"
          archive="frontend-${GITHUB_SHA}.tar.gz"
          remote_archive="$API_DEPLOY_PATH/$archive"
          tar -C dist -czf "$archive" .
          scp -i ~/.ssh/id_ed25519 -P "$port" "$archive" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          ssh -i ~/.ssh/id_ed25519 -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$API_DEPLOY_PATH/public" "$remote_archive" <<'REMOTE'
          set -euo pipefail
          target_public="$1"
          archive="$2"
          staging="$(mktemp -d "$target_public/.frontend_release.XXXXXX")"
          backup="$target_public/.frontend_backup_$(date +%Y%m%d_%H%M%S)"
          cleanup() {
            rm -rf "$staging"
            rm -f "$archive"
          }
          trap cleanup EXIT

          test -d "$target_public"
          mkdir -p "$backup"
          tar -xzf "$archive" -C "$staging"
          test -f "$staging/index.html"

          for entry in index.html favicon.ico js css img fonts assets; do
            if [[ -e "$target_public/$entry" ]]; then
              cp -a "$target_public/$entry" "$backup/"
            fi
            rm -rf "$target_public/$entry"
          done
          cp -a "$staging/." "$target_public/"
          REMOTE

      - name: Verify production site
        if: ${{ env.PRODUCTION_URL != '' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PRODUCTION_URL" > /dev/null
