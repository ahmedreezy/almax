name: Deploy Production

on:
  push:
    branches: [main]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build production frontend
        run: npm run build

  deploy:
    name: Deploy to cPanel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH }}
      API_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate deployment configuration
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST environment secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER environment secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY environment secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS environment secret}"
          : "${FRONTEND_DEPLOY_PATH:?Missing FRONTEND_DEPLOY_PATH environment variable}"
          : "${API_DEPLOY_PATH:?Missing API_DEPLOY_PATH environment variable}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$FRONTEND_DEPLOY_PATH" "$API_DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          frontend_path="$1"
          api_path="$2"

          test -d "$frontend_path/.git"
          test -d "$api_path/public"

          cd "$frontend_path"
          git diff --quiet
          git diff --cached --quiet
          git fetch --prune origin main
          git checkout main
          git merge --ff-only origin/main
          bash scripts/publish_to_laravel_public.sh "$api_path/public"
          REMOTE

      - name: Verify production site
        if: ${{ env.PRODUCTION_URL != '' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PRODUCTION_URL" > /dev/null
